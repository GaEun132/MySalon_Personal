name: Deploy To EC2

on:
  push:
    branches:
        - main
permissions:
  contents: read

jobs:
  SpringDeploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # Github의 코드를 Github Actions의 가상 컴퓨터에 내려받는다.

      - name: Set up JDK 17
        uses: actions/setup-java@v3 # Github Actions의 JDK 라이브러리
        with:
          distribution: 'temurin' # AdoptOpenJDK를 사용
          java-version: '17' # JDK 17 버전 사용

      - name: Build with Gradle # 빌드
        run: |
          chmod +x gradlew 
          ./gradlew build

      - name: Generate Image Tag
        id: image-tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        # 똑같은 latest로는 버전관리가 안되기 때문에 현재 커밋의 해시값을 가져와서
        # IMAGE_TAG라는 이름으로 환경변수에 저장합니다.
        #이제 밑에 다른 단계들에서도 ${{env.IMAGE_TAG}}로 이 값을 쓸 수 있습니다.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{secrets.AWS_REGION}}

        # AWS ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1


        # 현재 working directory에 있는 dockerfile을 가지고 이미지 빌드 후 ecr에 push
        # lastest .은 dockerfile이 있는 현재 위치를 의미. dockerfile을 읽어서 image를 빌드.
        # 이 단계에서는 docker-compose.yml을 읽지 않는다.
      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          ECR_REPOSITORY: shopping-ecr
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{env.IMAGE_TAG}} \
                        -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{env.IMAGE_TAG}}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      

      # 그리고 현재 위치에 있는 docker-compose.yml을 ec2에 전송
      - name: Copy Docker Compose file to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{secrets.SERVER_HOST}}     #ip주소
          username: ${{secrets.SERVER_USER}} #계정 아이디 ubuntu
          key: ${{secrets.SERVER_KEY}}    #.pem파일 내용
          port: 22
          # source: 내 컴퓨터(GitHub Actions)에 있는 파일 위치
          # target: 서버(EC2)에 저장할 위치 이러면 ubuntu 밑에 app/docker-compose.yml 디렉토리까지 복사됨
          source: "docker-compose.yml"
          target: "/home/ubuntu/app/"

        #ec2에 ssh원격 접속해서 aws 권한 주입 및 ecr 로그인
        #.env파일 생성 해서 배포 환경 설정, 이미지 pull 및 컨테이너 실행, 사용하지 않는 이미지 삭제
        # docker compose pull : docker-compose.yml에 정의된 이미지들을 pull한다.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{secrets.SERVER_HOST}}     #ip주소
          username: ${{secrets.SERVER_USER}} #계정 아이디 ubuntu
          key: ${{secrets.SERVER_KEY}}    #.pem파일 내용
          port: 22
          script: |      #export는 ssh 접속이 끝나면 휘발됨, aws 권한 주입
            export AWS_ACCESS_KEY_ID=${{secrets.AWS_ACCESS_KEY_ID}}
            export AWS_SECRET_ACCESS_KEY=${{secrets.AWS_SECRET_ACCESS_KEY}}
            export AWS_DEFAULT_REGION=${{secrets.AWS_DEFAULT_REGION}}
            
            aws ecr get-login-password | docker login --username AWS --password-stdin ${{steps.login-ecr.outputs.registry}}
            
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app

            echo "${{secrets.ENV_FILE_BASE64}}" | base64 -d > .env
            echo "ECR_REGISTRY_URI=${{steps.login-ecr.outputs.registry}}/shopping-ecr" >> .env
            echo "IMAGE_TAG=${{env.IMAGE_TAG}}" >> .env     
        
            docker compose pull                     
                                                       
            docker compose up -d --remove-orphans    
            
            docker image prune -f                      
